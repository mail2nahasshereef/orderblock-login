<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>OrderBlock login</title>
<style>
  :root{--bg:#0b0f16;--fg:#dde5ef;--muted:#7f8ca2;--accent:#f0b64a}
  @media (prefers-color-scheme: light){:root{--bg:#f2f4f7;--fg:#141b26;--muted:#5a6577;--accent:#c4840c}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
  main{max-width:440px;text-align:center}
  h1{font-size:20px;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 14px}
  a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Returning to OrderBlock…</h1>
  <p>Upstox only allows https login pages, so this page passes your login back to the app running on your own computer.</p>
  <p><a id="go" href="#">Continue to the app</a></p>
</main>
<script>
  // Forward Upstox's ?code=…&state=… (or ?error=…) to the app on this computer. Nothing is stored or sent anywhere else.
  var target = "http://127.0.0.1:8765/callback" + window.location.search;
  document.getElementById("go").href = target;
  window.location.replace(target);
</script>
</body>
</html>
